name: InstaBox Auto Watchdog

on:
  schedule:
    # 每 25 分钟执行一次，完全符合 GitHub 私人仓库每月 2000 分钟免费额度限制
    - cron: '*/25 * * * *'
  # 支持在 GitHub Actions 控制台手动点击 "Run workflow" 运行测试
  workflow_dispatch:

jobs:
  watchdog:
    name: Check & Wake InstaBox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Watchdog Script
        env:
          MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID || 'm_agqx76qe5b2o4aqknmyqzefj7i' }}
          API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          PUBLIC_URL: ${{ secrets.INSTABOX_PUBLIC_URL || 'https://6185-agqx76qe5b2o4aqknmyqzefj7i.instabox.tech' }}
        run: |
          chmod +x scripts/watchdog.sh
          ./scripts/watchdog.sh

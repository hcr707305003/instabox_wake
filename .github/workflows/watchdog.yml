name: InstaBox Auto Watchdog

on:
  schedule:
    # 每 25 分钟执行一次，完全符合 GitHub 私人仓库每月 2000 分钟免费额度限制
    - cron: '*/25 * * * *'
  # 支持在 GitHub Actions 控制台手动点击 "Run workflow" 运行测试
  workflow_dispatch:
    inputs:
      target_machines:
        description: '指定要保活的机器名称或ID（可选，多个用逗号隔开；留空则自动保活全部机器）'
        required: false
        default: ''

jobs:
  watchdog:
    name: Multi-Machine Watchdog & Wake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Multi-Machine Watchdog
        env:
          API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          # 优先使用手动触发时输入的机器列表，否则使用 Secret/Var 中的配置，留空则默认全自动发现
          TARGET_MACHINES: ${{ inputs.target_machines || vars.TARGET_MACHINES || secrets.TARGET_MACHINES || '' }}
        run: |
          chmod +x scripts/watchdog.sh
          ./scripts/watchdog.sh

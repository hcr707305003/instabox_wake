name: InstaBox Auto Watchdog

on:
  schedule:
    # 每 15 分钟执行一次（错峰避开整点拥堵：在每小时的第 3、18、33、48 分钟执行）
    - cron: '3,18,33,48 * * * *'
  # 支持在 GitHub Actions 控制台手动点击 "Run workflow" 运行测试
  workflow_dispatch:
    inputs:
      target_machines:
        description: '指定要保活的机器名称或ID（可选，多个用逗号隔开；留空则自动保活全部机器）'
        required: false
        default: ''

jobs:
  watchdog:
    name: Multi-Account & Multi-Machine Watchdog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Multi-Account Watchdog
        env:
          # 支持单个或多个 Key（支持逗号隔开或换行）
          API_KEYS: ${{ secrets.INSTABOX_API_KEYS || secrets.INSTABOX_API_KEY }}
          TARGET_MACHINES: ${{ inputs.target_machines || vars.TARGET_MACHINES || secrets.TARGET_MACHINES || '' }}
        run: |
          chmod +x scripts/watchdog.sh
          ./scripts/watchdog.sh
